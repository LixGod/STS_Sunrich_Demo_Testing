<s2s-page-header [heading]="record()?.name ?? ('masters.branch.new' | translate)" [subtitle]="record()?.code" backLink="/administration/branches">
  @if (record(); as branch) {
    <s2s-status-tag [active]="branch.active" />
    @if (canWrite()) {
      <p-button
        [label]="(branch.active ? 'common.deactivate' : 'common.activate') | translate"
        [severity]="branch.active ? 'secondary' : 'success'"
        [outlined]="true"
        (onClick)="changeStatus(null)" />
      <p-button
        [label]="'common.delete' | translate"
        icon="pi pi-trash"
        severity="danger"
        [outlined]="true"
        [loading]="saving()"
        (onClick)="confirmDelete()" />
    }
  }
</s2s-page-header>

@if (errorKey(); as key) {
  <p-message severity="error" role="alert" class="form-message">
    {{ key | translate }}
    @if (key === 'errors.codes.STALE_VERSION') {
      <p-button [label]="'common.reload' | translate" [text]="true" size="small" (onClick)="reload()" />
    }
  </p-message>
}

<form class="s2s-panel" [formGroup]="form" (ngSubmit)="save()" novalidate [attr.aria-busy]="loading()">
  <div class="s2s-form-grid">
    <s2s-form-field labelKey="masters.code" fieldId="code" [control]="form.controls.code" [required]="true" hintKey="masters.codeHint">
      <input pInputText id="code" formControlName="code" maxlength="20" autocapitalize="characters" />
    </s2s-form-field>
    <s2s-form-field labelKey="masters.name" fieldId="name" [control]="form.controls.name" [required]="true">
      <input pInputText id="name" formControlName="name" maxlength="150" />
    </s2s-form-field>
    <s2s-form-field labelKey="masters.timezone" fieldId="timezone" [control]="form.controls.timezone" [required]="true">
      <p-select inputId="timezone" formControlName="timezone" [options]="timeZones" [filter]="true" [placeholder]="'common.select' | translate" />
    </s2s-form-field>
    <s2s-form-field class="s2s-span-2" labelKey="masters.address" fieldId="address" [control]="form.controls.address">
      <textarea pTextarea id="address" formControlName="address" rows="3" maxlength="500"></textarea>
    </s2s-form-field>
  </div>

  @if (canWrite()) {
    <div class="s2s-actions">
      <p-button type="submit" [label]="'common.save' | translate" icon="pi pi-check" [loading]="saving()" [disabled]="loading()" />
    </div>
  }
</form>

@if (record() && canReadAudit()) {
  <section class="s2s-panel audit">
    <h2>{{ 'audit.history' | translate }}</h2>
    <s2s-audit-trail entityType="BRANCH" [entityId]="record()!.id" />
  </section>
}

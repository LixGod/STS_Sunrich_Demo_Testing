<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${s.jobNumber + ' SOF'}">SOF</title>
  <style>
    @page { size: A4; margin: 16mm 14mm 18mm 14mm;
      @bottom-center { content: "Page " counter(page) " of " counter(pages); font-family: sans-serif; font-size: 8pt; color: #666; } }
    body { font-family: sans-serif; font-size: 9pt; color: #1f2933; }
    h1 { font-size: 15pt; margin: 0 0 1mm; color: #7a1f2b; }
    h2 { font-size: 10pt; margin: 5mm 0 1.5mm; color: #7a1f2b; border-bottom: 0.5pt solid #c9ced6; padding-bottom: 1mm; page-break-after: avoid; }
    .muted { color: #5f6b7a; }
    table { width: 100%; border-collapse: collapse; }
    table.facts th { text-align: left; width: 30%; padding: 1mm 2mm 1mm 0; }
    table.facts td { padding: 1mm 0; }
    table.grid th { background: #f1f3f6; text-align: left; padding: 1.2mm; border-bottom: 0.5pt solid #c9ced6; }
    table.grid td { padding: 1.2mm; border-bottom: 0.5pt solid #e3e6ea; vertical-align: top; white-space: pre-wrap; }
    table.grid td.time { width: 30%; white-space: nowrap; }
    tr { page-break-inside: avoid; }
    .note { font-size: 8pt; color: #5f6b7a; margin-top: 3mm; }
    .draft { position: fixed; top: 110mm; left: 10mm; width: 160mm; text-align: center; font-size: 72pt; font-weight: bold;
      color: #d9d9d9; transform: rotate(-30deg); z-index: -1; }
  </style>
</head>
<body>
  <div class="draft" th:if="${s.draft}">DRAFT</div>
  <h1>Statement of Facts</h1>
  <div class="muted" th:text="${s.jobNumber + ' · ' + s.revision}">Job</div>

  <table class="facts">
    <tr th:each="v : ${s.vessels}"><th th:text="${v.first}">Vessel</th><td th:text="${v.second}">Name</td></tr>
    <tr><th>Times</th><td th:text="${'Local time, ' + s.timezone}">Zone</td></tr>
    <tr th:if="${s.issued != null}"><th>Issue</th><td th:text="${s.issued}">Issued</td></tr>
  </table>

  <div th:each="section : ${s.sections}">
    <h2 th:text="${section.title}">Section</h2>
    <table class="grid">
      <thead><tr><th>Time</th><th>Event</th><th>Vessel</th><th>Remarks</th></tr></thead>
      <tbody>
        <tr th:each="row : ${section.rows}">
          <td class="time" th:text="${row.time}">Time</td><td th:text="${row.event}">Event</td>
          <td th:text="${row.vessel}">Vessel</td><td th:text="${row.remarks}">Remarks</td>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="note" th:if="${s.sections.isEmpty()}">No operation events recorded.</p>
  <p class="note">Events as recorded in the Ship2Ship operations log. Corrections are kept in the log's history.</p>
</body>
</html>
